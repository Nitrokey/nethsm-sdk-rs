name: CI

on: [push, pull_request]

env:
  RUSTFLAGS: --deny warnings

jobs:
  check:
    name: Check library
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Check library
      run: cargo check --all-targets

  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag:
          - testing-v1.0
          - testing-v2.0
          - testing-v2.1
          - testing-v2.2
          - testing-v3.0
          - testing-v3.1
          - testing-v4.0
          - testing
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Run tests
      run: cargo test
      env:
        NETHSM_IMAGE_TAG: ${{ matrix.tag }}

  fmt:
    name: Run rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: "rustfmt"
    - name: Run rustfmt
      run: cargo fmt -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: "clippy"
    - name: Run clippy
      run: cargo clippy --all-features --all-targets

  check-msrv:
    name: Check library (MSRV)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.86
    - name: Check library
      run: cargo check --all-targets
